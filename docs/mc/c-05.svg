"VT,monospace">|-- Jenkinsfile                  </text><text x="327.60" y="80" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Jenkins pipeline definition</text><text x="24.00" y="106" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- README.md</text><text x="24.00" y="132" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- requirements.txt</text><text x="24.00" y="158" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- run_pipeline.sh              </text><text x="327.60" y="158" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># One-command local runner</text><text x="24.00" y="184" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|</text><text x="24.00" y="210" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- pipeline/</text><text x="24.00" y="236" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- pipeline_runner.py       </text><text x="327.60" y="236" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Main entry point (runs all stages)</text><text x="24.00" y="262" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- stage1_ingest.py         </text><text x="327.60" y="262" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Stage 1: Download CSV from UCI</text><text x="24.00" y="288" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- stage2_preprocess.py     </text><text x="327.60" y="288" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Stage 2: Clean, scale, split</text><text x="24.00" y="314" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- stage3_train.py          </text><text x="327.60" y="314" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Stage 3: Train Random Forest</text><text x="24.00" y="340" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- stage4_test.py           </text><text x="327.60" y="340" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Stage 4: Evaluate + pipeline gate</text><text x="24.00" y="366" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- stage5_visualize.py      </text><text x="327.60" y="366" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Stage 5: Generate 6 plots</text><text x="24.00" y="392" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- generate_report.py       </text><text x="327.60" y="392" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Generate summary dashboard</text><text x="24.00" y="418" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|</text><text x="24.00" y="444" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- data/</text><text x="24.00" y="470" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- winedataset.md           </text><text x="327.60" y="470" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Dataset documentation</text><text x="24.00" y="496" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- raw/                     </text><text x="327.60" y="496" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Auto-downloaded CSV (git-ignored)</text><text x="24.00" y="522" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- processed/               </text><text x="327.60" y="522" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Train/test splits (git-ignored)</text><text x="24.00" y="548" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|</text><text x="24.00" y="574" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- models/                      </text><text x="327.60" y="574" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Saved model + metrics (git-ignored)</text><text x="24.00" y="600" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|</text><text x="24.00" y="626" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|-- outputs/</text><text x="24.00" y="652" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   |-- pipeline_report.md       </text><text x="327.60" y="652" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Execution report</text><text x="24.00" y="678" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|   `-- plots/                   </text><text x="327.60" y="678" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># 7 output PNG charts</text><text x="24.00" y="704" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">|</text><text x="24.00" y="730" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">`-- tests/</text><text x="24.00" y="756" font-size="23" fill="#d0d0d0" xml:space="preserve" font-family="VT,monospace">    `-- test_pipeline.py         </text><text x="327.60" y="756" font-size="23" fill="#7c8086" xml:space="preserve" font-family="VT,monospace"># Unit tests (pytest)</text><g id="vines"><rect x="30" y="0" width="6" height="6" fill="#2f5229"/><rect x="90" y="0" width="6" height="6" fill="#2f5229"/><rect x="108" y="0" width="6" height="6" fill="#2f5229"/><rect x="150" y="0" width="6" height="6" fill="#2f5229"/><rect x="210" y="0" width="6" height="6" fill="#2f5229"/><rect x="282" y="